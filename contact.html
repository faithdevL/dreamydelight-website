<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order a Cake | DFAITH Cake Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="contact.html">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">DFAITH <span>CAKE SHOP</span></a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="navMenu">
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="">About Us</a>
        <a class="nav-link" href="cakes.html">Cakes</a>
        <a class="nav-link active" href="contact.html"> Contact</a>
      </div>
    </div>
  </div>
</nav>

<section class="container section-space">
  <div class="text-center mb-5">
    <p class="eyebrow">LET'S MAKE IT SWEET</p>
    <h1 class="section-title">Order Your Dream Cake</h1>
    <p class="intro">Tell us what you're craving or describe your custom cake idea.</p>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-8">
      <form class="order-form" onsubmit="event.preventDefault(); alert('Thank you! This is a demo form. Your order has not been sent to the shop.');">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="customer">Your Name</label>
            <input class="form-control" id="customer" type="text" placeholder="Enter your name" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="email">Email Address</label>
            <input class="form-control" id="email" type="email" placeholder="Enter your email" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="type">Cake Type</label>
            <select class="form-select" id="type" required>
              <option value="">Choose a cake</option>
              <option>Ready-Made Cake</option>
              <option>Customized Cake</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="flavor">Cake Flavor</label>
            <select class="form-select" id="flavor" required>
              <option value="">Choose a flavor</option>
              <option>Chocolate</option>
              <option>Vanilla</option>
              <option>Strawberry</option>
              <option>Red Velvet</option>
              <option>Other / Please Discuss</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="date">Preferred Pickup Date</label>
            <input class="form-control" id="date" type="date" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="budget">Budget (₱)</label>
            <input class="form-control" id="budget" type="number" min="1" placeholder="Your budget">
          </div>
          <div class="col-12">
            <label class="form-label" for="details">Cake Design / Message</label>
            <textarea class="form-control" id="details" rows="4" placeholder="Describe your cake size, theme, colors, message, and other details." required></textarea>
          </div>
          <div class="col-12 text-center">
            <button class="btn btn-cake" type="submit">Submit Cake Request</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</section>

<footer>© 2026 DREAMY DELIGHTS | Made with love ♡</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
